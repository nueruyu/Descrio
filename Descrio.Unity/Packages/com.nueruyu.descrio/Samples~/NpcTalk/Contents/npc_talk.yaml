statements:
  - !run
    name: ShowMessage
    args:
      text: 'Welcome. I am a guide.'

  - !run
    name: ShowMessage
    args:
      text: 'I can help you with your task. What would you like to do?'

  - !let
    name: choice_index
    value: !run
      name: ShowChoices
      args:
        choices: ['Ask about this system', 'Explore the area', 'Leave']

  - !when
    cases:
      - condition: !expr choice_index == 0
        then:
          - !run
            name: ShowMessage
            args:
              text: 'This system allows logic to be defined via simple text files.'
      - condition: !expr choice_index == 1
        then:
          - !run
            name: ShowMessage
            args:
              text: 'You look around. It is a quiet and peaceful place.'
      - then:
          - !run
            name: ShowMessage
            args:
              text: 'Farewell.'